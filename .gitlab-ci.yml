stages:
  - lint
  - test
  - build

default:
  image: python:3.12-slim
  before_script:
    - pip install --no-cache-dir uv
    - uv sync --extra dev
  cache:
    key:
      files:
        - uv.lock
    paths:
      - .venv/

variables:
  UV_LINK_MODE: copy

lint:
  stage: lint
  script:
    - uv run ruff check .
    - uv run ruff format --check .

test:
  stage: test
  script:
    - uv run pytest --junitxml=report.xml
  artifacts:
    when: always
    expire_in: 1 week
    reports:
      junit: report.xml

build-image:
  stage: build
  image: docker:27
  services:
    - docker:27-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  before_script: []
  script:
    - docker build -t derbit-client:"$CI_COMMIT_SHORT_SHA" .
  rules:
    - if: $CI_COMMIT_BRANCH
